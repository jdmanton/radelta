name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Check release metadata
        run: python scripts/check_release_metadata.py

      - name: Check tag matches VERSION
        shell: bash
        run: |
          expected="v$(cat VERSION)"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION ($expected)" >&2
            exit 1
          fi

      - name: Formatting
        working-directory: native
        run: cargo fmt --check

      - name: Clippy
        working-directory: native
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        working-directory: native
        run: cargo test --all-targets

  native:
    name: Native ${{ matrix.label }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            label: Windows x86-64
            platform: windows
            arch: x86_64
          - runner: ubuntu-latest
            label: Linux x86-64
            platform: linux
            arch: x86_64
          - runner: ubuntu-24.04-arm
            label: Linux ARM64
            platform: linux
            arch: aarch64
          - runner: macos-15-intel
            label: macOS Intel
            platform: macos
            arch: x86_64
          - runner: macos-latest
            label: macOS Apple Silicon
            platform: macos
            arch: aarch64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Test release build
        working-directory: native
        run: cargo test --release

      - name: Build
        working-directory: native
        run: cargo build --release

      - name: Package native release
        run: >-
          python scripts/package_native.py
          --platform ${{ matrix.platform }}
          --arch ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/radelta-*.zip
          if-no-files-found: error
          retention-days: 7

  imagej:
    name: Universal ImageJ/Fiji plugin
    needs: native
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native-packages
          merge-multiple: true

      - name: Add native libraries to ImageJ plugin
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          root = Path.cwd()
          version = (root / "VERSION").read_text(encoding="utf-8").strip()
          packages = root / "native-packages"
          resources = root / "imagej-plugin" / "src" / "main" / "resources" / "natives"

          targets = [
              ("windows", "x86_64", "windows-x86_64", "radelta.dll"),
              ("linux", "x86_64", "linux-x86_64", "libradelta.so"),
              ("linux", "aarch64", "linux-aarch64", "libradelta.so"),
              ("macos", "x86_64", "macos-x86_64", "libradelta.dylib"),
              ("macos", "aarch64", "macos-aarch64", "libradelta.dylib"),
          ]

          for platform, arch, resource_dir, library_name in targets:
              archive = packages / f"radelta-{version}-{platform}-{arch}.zip"
              if not archive.is_file():
                  raise SystemExit(f"Missing native package: {archive}")

              destination = resources / resource_dir / library_name
              destination.parent.mkdir(parents=True, exist_ok=True)

              with ZipFile(archive) as zf:
                  matches = [n for n in zf.namelist() if n.endswith("/" + library_name)]
                  if len(matches) != 1:
                      raise SystemExit(
                          f"Expected one {library_name} in {archive}, found {len(matches)}"
                      )
                  destination.write_bytes(zf.read(matches[0]))

              print(f"{archive.name}: {library_name} -> {destination}")
          PY

      - name: Build universal plugin JAR
        working-directory: imagej-plugin
        run: mvn --batch-mode package

      - uses: actions/upload-artifact@v4
        with:
          name: imagej-universal
          path: imagej-plugin/target/radelta-imagej-*.jar
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [native, imagej]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: release-assets
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: imagej-universal
          path: release-assets

      - name: Create checksums
        working-directory: release-assets
        shell: bash
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(cat VERSION)"
          gh release create "$GITHUB_REF_NAME" \
            release-assets/* \
            --verify-tag \
            --title "Radelta $version" \
            --generate-notes

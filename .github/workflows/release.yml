name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Check release metadata
        run: python scripts/check_release_metadata.py

      - name: Check tag matches VERSION
        shell: bash
        run: |
          expected="v$(cat VERSION)"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION ($expected)" >&2
            exit 1
          fi

      - name: Formatting
        working-directory: native
        run: cargo fmt --check

      - name: Clippy
        working-directory: native
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        working-directory: native
        run: cargo test --all-targets

  native:
    name: Native ${{ matrix.label }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            label: Windows x86-64
            platform: windows
            arch: x86_64
          - runner: ubuntu-latest
            label: Linux x86-64
            platform: linux
            arch: x86_64
            container: quay.io/pypa/manylinux_2_28_x86_64
          - runner: ubuntu-24.04-arm
            label: Linux ARM64
            platform: linux
            arch: aarch64
            container: quay.io/pypa/manylinux_2_28_aarch64
          - runner: macos-15-intel
            label: macOS Intel
            platform: macos
            arch: x86_64
          - runner: macos-latest
            label: macOS Apple Silicon
            platform: macos
            arch: aarch64

    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container || '' }}
    defaults:
      run:
        shell: bash
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0

      - uses: actions/setup-python@v5
        if: matrix.platform != 'linux'
        with:
          python-version: '3.12'

      - name: Select manylinux Python
        if: matrix.platform == 'linux'
        run: echo /opt/python/cp312-cp312/bin >> "$GITHUB_PATH"

      - name: Test release build
        working-directory: native
        run: cargo test --release

      - name: Build
        working-directory: native
        run: cargo build --release

      - name: Package native release
        run: >-
          python scripts/package_native.py
          --platform ${{ matrix.platform }}
          --arch ${{ matrix.arch }}

      - name: Install wheel build tools
        run: python -m pip install build packaging "setuptools>=70.1"

      - name: Install Linux wheel repair tools
        if: matrix.platform == 'linux'
        run: python -m pip install auditwheel patchelf

      - name: Install Windows wheel repair tools
        if: matrix.platform == 'windows'
        run: python -m pip install delvewheel

      - name: Install macOS wheel repair tools
        if: matrix.platform == 'macos'
        run: python -m pip install delocate

      - name: Install TIFF integration dependencies
        run: python -m pip install numpy tifffile imagecodecs

      - name: Test packaging and TIFF I/O
        env:
          RADELTA_CLI: ${{ github.workspace }}/native/target/release/radelta${{ matrix.platform == 'windows' && '.exe' || '' }}
        run: python -m unittest discover -s scripts/tests -v

      - name: Build and repair self-contained OME-Zarr wheel
        run: >-
          python scripts/package_zarr_wheel.py
          --platform ${{ matrix.platform }}
          --arch ${{ matrix.arch }}

      - name: Test installed wheel outside the checkout
        run: python scripts/test_zarr_wheel.py

      - name: Build and test public Python array wheel
        run: |
          python scripts/package_python_wheel.py --kind array --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --library-dir native/target/release
          python scripts/test_python_wheel.py --kind array --wheel-dir dist/array-wheels

      - uses: actions/upload-artifact@v4
        with:
          name: array-wheel-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/array-wheels/*.whl
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/radelta-*.zip
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: zarr-wheel-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/zarr-wheels/*.whl
          if-no-files-found: error
          retention-days: 7

  hdf5:
    name: HDF5 packages
    needs: verify
    uses: ./.github/workflows/hdf5-build.yml

  imagej:
    name: Universal ImageJ/Fiji plugin
    needs: [native, hdf5]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native-packages
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: hdf5-*
          path: hdf5-packages
          merge-multiple: true

      - name: Add native libraries to ImageJ plugin
        run: >-
          python scripts/stage_imagej_natives.py
          --native-packages native-packages
          --hdf5-packages hdf5-packages
          --linux-test-tools _deps/imagej-test-tools

      - name: Build universal plugin JAR
        working-directory: imagej-plugin
        env:
          RADELTA_NATIVE_LIBRARY: ${{ github.workspace }}/_deps/imagej-test-tools/libradelta.so
        run: mvn --batch-mode package

      - name: Package complete Fiji installation
        run: |
          version=$(cat VERSION)
          python scripts/package_imagej_fiji.py --jar "imagej-plugin/target/radelta-imagej-${version}.jar"

      - uses: actions/upload-artifact@v4
        with:
          name: imagej-universal
          path: imagej-plugin/target/radelta-imagej-*.jar
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: imagej-fiji-bundle
          path: dist/radelta-imagej-*-fiji.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [native, imagej, hdf5]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: release-assets
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: imagej-universal
          path: release-assets

      - uses: actions/download-artifact@v4
        with:
          name: imagej-fiji-bundle
          path: release-assets

      - uses: actions/download-artifact@v4
        with:
          pattern: zarr-wheel-*
          path: release-assets
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: array-wheel-*
          path: release-assets
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: hdf5-*
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        working-directory: release-assets
        shell: bash
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(cat VERSION)"
          gh release create "$GITHUB_REF_NAME" \
            release-assets/* \
            --verify-tag \
            --title "Radelta $version" \
            --generate-notes

name: OME-Zarr CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ome-zarr:
    name: OME-Zarr (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: x86_64
            container: quay.io/pypa/manylinux_2_28_x86_64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
            container: quay.io/pypa/manylinux_2_28_aarch64
          - runner: windows-2022
            platform: windows
            arch: x86_64
          - runner: macos-15-intel
            platform: macos
            arch: x86_64
          - runner: macos-15
            platform: macos
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container || '' }}
    defaults:
      run:
        shell: bash
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: matrix.platform != 'linux'
        with:
          python-version: '3.12'
      - name: Select manylinux Python
        if: matrix.platform == 'linux'
        run: echo /opt/python/cp312-cp312/bin >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - name: Build native codec
        run: cargo build --release --locked --manifest-path native/Cargo.toml
      - name: Package matching Python codec and native library
        run: python scripts/package_native.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
      - name: Install wheel build tools
        run: python -m pip install build wheel packaging "setuptools>=68"
      - name: Install Linux wheel repair tools
        if: matrix.platform == 'linux'
        run: python -m pip install auditwheel patchelf
      - name: Install Windows wheel repair tools
        if: matrix.platform == 'windows'
        run: python -m pip install delvewheel
      - name: Install macOS wheel repair tools
        if: matrix.platform == 'macos'
        run: python -m pip install delocate
      - name: Test wheel packaging
        # Regression check: a universal2 Python must not mislabel a thin dylib.
        run: python -m unittest discover -s scripts/tests -v
      - name: Build and repair self-contained OME-Zarr wheel
        run: python scripts/package_zarr_wheel.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
      - name: Check release metadata
        run: python scripts/check_release_metadata.py
      - name: Test installed wheel outside the checkout
        run: python scripts/test_zarr_wheel.py
      - uses: actions/upload-artifact@v4
        with:
          name: ome-zarr-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/radelta-*.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: zarr-wheel-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/zarr-wheels/*.whl
          if-no-files-found: error
          retention-days: 14

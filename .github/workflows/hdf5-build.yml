name: HDF5 builds

on:
  push:
    branches: ['**']
    paths:
      - '.github/workflows/hdf5-build.yml'
      - '.github/workflows/release.yml'
      - 'hdf5/**'
      - 'imagej-plugin/**'
      - 'native/**'
      - 'python/**'
      - 'scripts/build_hdf5_dependency.py'
      - 'scripts/package_hdf5.py'
      - 'scripts/package_hdf5_filter.py'
      - 'scripts/package_python_wheel.py'
      - 'scripts/package_zarr_wheel.py'
      - 'scripts/test_python_wheel.py'
      - 'scripts/test_hdf5_fiji.py'
      - 'scripts/java_dependencies.py'
      - 'scripts/check_release_metadata.py'
      - 'rust-toolchain.toml'
      - 'VERSION'
      - 'LICENSE'
  pull_request:
    paths:
      - '.github/workflows/hdf5-build.yml'
      - '.github/workflows/release.yml'
      - 'hdf5/**'
      - 'imagej-plugin/**'
      - 'native/**'
      - 'python/**'
      - 'scripts/build_hdf5_dependency.py'
      - 'scripts/package_hdf5.py'
      - 'scripts/package_hdf5_filter.py'
      - 'scripts/package_python_wheel.py'
      - 'scripts/package_zarr_wheel.py'
      - 'scripts/test_python_wheel.py'
      - 'scripts/test_hdf5_fiji.py'
      - 'scripts/java_dependencies.py'
      - 'scripts/check_release_metadata.py'
      - 'rust-toolchain.toml'
      - 'VERSION'
      - 'LICENSE'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: HDF5 ${{ matrix.label }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            label: Windows x86-64
            platform: windows
            arch: x86_64
          - runner: ubuntu-24.04
            label: Linux x86-64
            platform: linux
            arch: x86_64
          - runner: ubuntu-24.04-arm
            label: Linux ARM64
            platform: linux
            arch: aarch64
          - runner: macos-15-intel
            label: macOS Intel
            platform: macos
            arch: x86_64
          - runner: macos-15
            label: macOS Apple Silicon
            platform: macos
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - name: Check release metadata
        run: python scripts/check_release_metadata.py
      - name: Check out HDF5 1.14.6
        uses: actions/checkout@v4
        with:
          repository: HDFGroup/hdf5
          ref: 7bf340440909d468dbb3cf41f0ea0d87f5050cea
          path: _deps/hdf5-source
          persist-credentials: false
      - name: Build matching shared HDF5 SDK
        run: >-
          python scripts/build_hdf5_dependency.py
          --source _deps/hdf5-source
          --build _deps/hdf5-build
          --prefix _deps/hdf5-install
      - name: Configure and build plugin
        run: |
          cmake -S hdf5 -B hdf5/build -DCMAKE_BUILD_TYPE=Release \
            -DHDF5_ROOT="$GITHUB_WORKSPACE/_deps/hdf5-install" \
            -DHDF5_USE_STATIC_LIBRARIES=OFF
          cmake --build hdf5/build --config Release --parallel 2
      - name: Install plugin and native test
        run: cmake --install hdf5/build --config Release --prefix "$GITHUB_WORKSPACE/_deps/hdf5-install"
      - name: Package and test relocated binaries
        run: >-
          python scripts/package_hdf5.py
          --platform ${{ matrix.platform }}
          --arch ${{ matrix.arch }}
          --prefix _deps/hdf5-install
          --hdf5-source _deps/hdf5-source
          --hdf5-version 1.14.6
          --smoke-test
      - name: Package standalone HDF5 filter
        run: >-
          python scripts/package_hdf5_filter.py
          --platform ${{ matrix.platform }}
          --arch ${{ matrix.arch }}
          --prefix _deps/hdf5-install
          --hdf5-source _deps/hdf5-source
      - name: Install Python wheel tools
        run: python -m pip install build packaging "setuptools>=70.1"
      - name: Install Linux wheel repair tools
        if: matrix.platform == 'linux'
        run: python -m pip install auditwheel patchelf
      - name: Install Windows wheel repair tools
        if: matrix.platform == 'windows'
        run: python -m pip install delvewheel
      - name: Install macOS wheel repair tools
        if: matrix.platform == 'macos'
        run: python -m pip install delocate
      - name: Build self-contained HDF5 wheel
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: >-
          python scripts/package_python_wheel.py --kind hdf5
          --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
          --library-dir _deps/hdf5-install/lib/hdf5/fiji-plugins
          --manylinux-policy manylinux_2_34
      - name: Test installed HDF5 wheel with current h5py
        run: |
          python scripts/package_python_wheel.py --kind array --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --library-dir hdf5/build/cargo/release --dist-dir dist/hdf5-integration-array-wheels --manylinux-policy manylinux_2_34
          python scripts/test_python_wheel.py --kind combined --wheel-dir dist/hdf5-wheels --array-wheel-dir dist/hdf5-integration-array-wheels
      - name: Select Python for h5py 3.10 compatibility
        # h5py 3.10 has Python 3.11 wheels on all five platforms, but no
        # Python 3.12 wheel for Linux ARM64. Keep this a binary-install test.
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test installed HDF5 wheel with h5py 3.10
        run: python scripts/test_python_wheel.py --kind hdf5 --wheel-dir dist/hdf5-wheels --h5py-version 3.10.0
      - uses: actions/upload-artifact@v4
        with:
          name: hdf5-wheel-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/hdf5-wheels/*.whl
          if-no-files-found: error
          retention-days: 14
      - name: Test relocated decoder and existing Fiji importer
        run: |
          version=$(cat VERSION)
          python scripts/test_hdf5_fiji.py \
            --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} \
            --prefix _deps/hdf5-install \
            --build-imagej \
            --archive "dist/radelta-hdf5-filter-${version}-${{ matrix.platform }}-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: hdf5-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/radelta-hdf5-*.zip
          if-no-files-found: error
          retention-days: 14
